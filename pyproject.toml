[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feedhand"
version = "0.1.0"
description = "Multi-channel feed publisher engine: validate, approve, publish and log posts to X, Threads, Instagram, plus copy-paste bundles for manual channels."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
feedhand = "feedhand.cli:main"

[tool.setuptools]
packages = ["feedhand", "feedhand.channels"]
